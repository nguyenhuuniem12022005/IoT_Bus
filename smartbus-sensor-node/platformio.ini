[platformio]
default_envs = esp32s3
; Use the complete toolchain already installed beside this project.
core_dir = ../.sensor-pio

[env:esp32s3]
upload_port = COM6
monitor_port = COM6
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags = -DCORE_DEBUG_LEVEL=1 -std=gnu++17
lib_deps =
    256dpi/MQTT@2.5.2
    bblanchon/ArduinoJson@7.2.0
    olikraus/U8g2@2.36.2

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DNATIVE_TEST
build_src_filter = -<*> +<passenger_counter.cpp> +<state_machine.cpp>
test_build_src = yes
