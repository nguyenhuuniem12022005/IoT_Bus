# Nhân bản hai nhóm node và đổi bus01 khi thêm xe; không dùng wildcard chéo xe.
user esp32-bus01
topic write smartbus/bus01/sensor/#
topic write smartbus/bus01/alert
topic write smartbus/bus01/cmd/ack
topic read smartbus/bus01/cmd/sensor
topic read smartbus/bus01/vision/count

user laptop-bus01
topic write smartbus/bus01/vision/#
topic write smartbus/bus01/cmd/ack
topic read smartbus/bus01/cmd/vision

user backend
topic write smartbus/+/cmd/sensor
topic write smartbus/+/cmd/vision
topic read smartbus/+/#
